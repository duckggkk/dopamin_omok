name: dopamin-omok

services:
  # ── Database ─────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: omok_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: dopamin_omok
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    # 프로덕션에서는 DB 포트를 호스트에 노출하지 않음 (내부망만 접근)
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - omok_net

  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omok_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://db:3306/dopamin_omok?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    # 프로덕션에서는 backend 포트도 외부 노출 안 함 (nginx가 프록시)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - omok_net

  # ── Frontend (Nginx) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omok_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"   # 외부에 노출되는 유일한 포트
    depends_on:
      - backend
    networks:
      - omok_net

volumes:
  mysql_data:

networks:
  omok_net:
    driver: bridge
