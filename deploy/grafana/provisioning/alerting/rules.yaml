# 알림 규칙 — 백엔드에서 ERROR 로그가 발생하면 알린다.
#
# 무엇을 잡나:
#   #8 적용 후 정상 4xx는 더 이상 ERROR가 아니므로, 여기 걸리는 건 "진짜 문제"다:
#     - 처리되지 않은 예외(GlobalExceptionHandler 의 log.error)
#     - 이메일 발송 최종 실패(JavaMailEmailAdapter 의 "이메일 발송 최종 실패" → #10)
#
# 동작: 최근 5분간 {service="backend"} 로그 중 "ERROR"가 1건 이상이면 발화.
# 평가 주기 1분, 즉시(for:0m) 발화. 정상(로그 없음)은 발화하지 않는다(noDataState: OK).
apiVersion: 1

groups:
  - orgId: 1
    name: app-errors
    folder: Alerts
    interval: 1m
    rules:
      - uid: backend-error-logs
        title: 백엔드 ERROR 로그 발생
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: '최근 5분간 백엔드 ERROR 로그가 감지되었습니다. Grafana Explore 에서 {service="backend"} |= "ERROR" 로 확인하세요.'
        labels:
          severity: critical
        data:
          # A: Loki 에서 최근 5분 ERROR 라인 수를 센다
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              refId: A
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({service="backend"} |= "ERROR" [5m]))'
              queryType: range
          # B: 단일 숫자로 축약(last)
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource:
                type: __expr__
                uid: __expr__
          # C: 0보다 크면 발화
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
