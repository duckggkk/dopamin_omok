# 알림 수신처(Contact points) — 에러 알림을 디스코드와 이메일 두 곳으로 보낸다.
#
# 값은 grafana 컨테이너의 환경변수로 주입한다(compose.prod 참고):
#   - DISCORD_WEBHOOK_URL : 디스코드 채널 웹훅 URL
#   - ALERT_EMAIL_TO      : 알림 받을 이메일(기본: 운영 이메일)
# 이메일 발송은 Grafana SMTP 설정(GF_SMTP_*, 기존 Gmail 재사용)이 함께 있어야 동작한다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ops-notify
    receivers:
      - uid: ops-discord
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
      - uid: ops-email
        type: email
        settings:
          addresses: ${ALERT_EMAIL_TO}
          singleEmail: true
