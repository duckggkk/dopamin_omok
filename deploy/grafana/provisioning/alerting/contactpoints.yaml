# 알림 수신처(Contact points) — 에러 알림을 이메일로 보낸다.
#
# 값은 grafana 컨테이너의 환경변수로 주입한다(compose.prod 참고):
#   - ALERT_EMAIL_TO : 알림 받을 이메일(기본: 운영 이메일)
# 이메일 발송은 Grafana SMTP 설정(GF_SMTP_*, 기존 Gmail 재사용)이 함께 있어야 동작한다.
#
# ⚠️ 여기에 수신처를 추가할 때 주의:
#    Grafana 는 설정이 하나라도 잘못되면 프로비저닝 모듈이 실패하고, 그러면 HTTP 서버까지
#    안 뜬다(= /grafana 502). 즉 "알림 하나 안 가는" 정도로 끝나지 않고 Grafana 전체가 죽는다.
#    특히 필수 값(URL 등)을 환경변수로 넣을 땐, 그 값이 비어 있으면 기동 자체가 실패한다.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ops-notify
    receivers:
      - uid: ops-email
        type: email
        settings:
          addresses: ${ALERT_EMAIL_TO}
          singleEmail: true

      # ── 디스코드 알림을 쓰려면 ────────────────────────────────────────────────
      # 1) 디스코드 채널 > 설정 > 연동 > 웹훅 > 새 웹훅 → URL 복사
      # 2) .env.prod 에  DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/...  채우기
      # 3) 아래 3줄 주석 해제 후 재배포
      # ⚠️ URL 을 비운 채로 주석만 풀면 Grafana 가 기동하지 않는다(위 경고 참고).
      #
      # - uid: ops-discord
      #   type: discord
      #   settings:
      #     url: ${DISCORD_WEBHOOK_URL}
