# Grafana 가 부팅할 때 Prometheus 를 데이터소스로 자동 등록한다.
# (UI에서 수동으로 클릭해 추가할 필요 없음)
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus            # 대시보드/알림 규칙이 이 고정 UID로 참조한다(Loki 와 같은 방식)
    access: proxy
    url: http://prometheus:9090      # docker 내부망의 Prometheus
    isDefault: true
    editable: false
