# Prometheus 수집 설정 — 로컬 개발 전용(docker-compose.dev.yml 에서만 사용).
#
# 운영(prometheus.yml)과 딱 한 줄, '백엔드를 어디서 찾는가'만 다르다.
#   운영: backend:8080          — 백엔드가 항상 같은 도커 네트워크 안에 있다.
#   개발: host.docker.internal:8080
#         내 PC 의 8080 을 가리킨다. 백엔드를 IDE/gradlew bootRun 으로 직접 띄우든(profile=local),
#         docker-compose.dev.yml 로 띄우든(8080 을 호스트에 공개) 양쪽 다 이 주소로 닿는다.
#         → 실행 방식을 바꿔도 설정을 고칠 필요가 없다.
#
# 주의: host.docker.internal 은 Docker Desktop(Windows/macOS) 전용 이름이다.
#       그래서 리눅스인 운영 서버는 이 파일을 쓰지 않는다(prometheus.yml 사용).

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Spring Boot 백엔드 (Micrometer 메트릭)
  # 메트릭이 안 잡히면: 백엔드가 떠 있는지 + application-local.yml(또는 -docker.yml)의
  # management.endpoints.web.exposure.include 에 prometheus 가 있는지 확인.
  - job_name: 'spring-backend'
    metrics_path: '/api/actuator/prometheus'   # context-path(/api) 포함
    static_configs:
      - targets: ['host.docker.internal:8080']

  # Prometheus 자기 자신도 모니터링
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
