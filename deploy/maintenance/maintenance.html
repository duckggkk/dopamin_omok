<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>서비스 점검 중 · 도파민 오목</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
      background: radial-gradient(circle at 30% 20%, #2b2150, #15102b 60%, #0c0a1a);
      color: #f4f1ff;
    }
    .card {
      width: 100%; max-width: 440px; text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px; padding: 44px 32px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .emoji { font-size: 56px; line-height: 1; margin-bottom: 18px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.7; color: #c9c2e8; }
    .sub { margin-top: 18px; font-size: 13px; color: #9a92c4; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
           background: #8b7bff; margin-right: 6px; animation: pulse 1.4s infinite ease-in-out; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">🛠️</div>
    <h1>잠시 서비스를 점검하고 있어요</h1>
    <p>
      더 나은 서비스를 위해 업데이트를 진행 중입니다.<br />
      잠시 후 다시 접속해 주세요. 보통 몇 분 내로 완료됩니다.
    </p>
    <p class="sub"><span class="dot"></span>점검이 끝나면 자동으로 정상화됩니다.</p>
  </main>
</body>
</html>
