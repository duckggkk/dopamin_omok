<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="380" height="230">
  <defs>
    <!-- 다크 레드 글로우 -->
    <radialGradient id="loss-bg-glow" cx="50%" cy="50%" r="48%">
      <stop offset="0%"   stop-color="#cc2020" stop-opacity="0.35"/>
      <stop offset="55%"  stop-color="#800000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#400000" stop-opacity="0"/>
    </radialGradient>
    <!-- 크랙 필터 (미세 흔들림) -->
    <filter id="crack-filter" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
    <!-- 파편 글로우 -->
    <filter id="shard-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 레드 글로우 -->
  <ellipse cx="190" cy="115" rx="165" ry="100" fill="url(#loss-bg-glow)"/>

  <!-- 깨진 원형 링 3개 -->
  <circle cx="190" cy="115" r="92" fill="none" stroke="#cc3030" stroke-width="1.8"
          stroke-dasharray="28 9 38 6 22 11 45 7" opacity="0.45"/>
  <circle cx="190" cy="115" r="65" fill="none" stroke="#aa2020" stroke-width="1.3"
          stroke-dasharray="20 7 30 5 16 8" opacity="0.38"/>
  <circle cx="190" cy="115" r="38" fill="none" stroke="#882020" stroke-width="1"
          stroke-dasharray="12 5 18 4" opacity="0.35"/>

  <!-- 방사형 크랙 라인 8개 -->
  <g filter="url(#crack-filter)" opacity="0.5">
    <!-- 상단 -->
    <polyline points="190,115 182,72 178,40" fill="none" stroke="#cc3030" stroke-width="1.4"/>
    <polyline points="190,115 198,72 202,40" fill="none" stroke="#cc3030" stroke-width="1"/>
    <!-- 우상 -->
    <polyline points="190,115 240,80 280,48" fill="none" stroke="#cc3030" stroke-width="1.4"/>
    <!-- 우측 -->
    <polyline points="190,115 250,112 305,110" fill="none" stroke="#cc3030" stroke-width="1.2"/>
    <!-- 우하 -->
    <polyline points="190,115 238,152 272,182" fill="none" stroke="#cc3030" stroke-width="1.4"/>
    <!-- 하단 -->
    <polyline points="190,115 184,162 180,200" fill="none" stroke="#cc3030" stroke-width="1"/>
    <!-- 좌하 -->
    <polyline points="190,115 142,152 108,182" fill="none" stroke="#cc3030" stroke-width="1.4"/>
    <!-- 좌측 -->
    <polyline points="190,115 130,112 75,110" fill="none" stroke="#cc3030" stroke-width="1.2"/>
    <!-- 좌상 -->
    <polyline points="190,115 140,78 100,48" fill="none" stroke="#cc3030" stroke-width="1.4"/>
  </g>

  <!-- 크랙 가지 (2차 갈라짐) -->
  <g filter="url(#crack-filter)" opacity="0.3">
    <line x1="220" y1="90"  x2="245" y2="72"  stroke="#aa2020" stroke-width="0.9"/>
    <line x1="245" y1="88"  x2="262" y2="68"  stroke="#aa2020" stroke-width="0.8"/>
    <line x1="160" y1="90"  x2="135" y2="72"  stroke="#aa2020" stroke-width="0.9"/>
    <line x1="235" y1="135" x2="255" y2="155" stroke="#aa2020" stroke-width="0.8"/>
    <line x1="145" y1="135" x2="125" y2="155" stroke="#aa2020" stroke-width="0.8"/>
  </g>

  <!-- 파편 조각 (삼각형) -->
  <g filter="url(#shard-glow)" opacity="0.5">
    <polygon points="190,109 183,122 197,122" fill="#cc2020"/>
    <!-- 작은 파편들 -->
    <polygon points="162,88  155,98  169,95"  fill="#aa1818" opacity="0.6"/>
    <polygon points="218,88  225,98  211,95"  fill="#aa1818" opacity="0.6"/>
    <polygon points="158,135 148,148 165,142" fill="#aa1818" opacity="0.5"/>
    <polygon points="222,135 232,148 215,142" fill="#aa1818" opacity="0.5"/>
  </g>

  <!-- 중앙 구멍 (블랙홀 효과) -->
  <circle cx="190" cy="115" r="14" fill="none" stroke="#dd3030" stroke-width="2" opacity="0.6"
          filter="url(#shard-glow)"/>
  <circle cx="190" cy="115" r="6"  fill="#cc1010" opacity="0.8"/>
  <circle cx="190" cy="115" r="3"  fill="#ff3030" opacity="0.9"/>

  <!-- 주변 불씨 파티클 -->
  <g opacity="0.55">
    <circle cx="112" cy="52"  r="2.5" fill="#ff4040"/>
    <circle cx="268" cy="52"  r="2.5" fill="#ff4040"/>
    <circle cx="82"  cy="115" r="2"   fill="#dd3030"/>
    <circle cx="298" cy="115" r="2"   fill="#dd3030"/>
    <circle cx="118" cy="178" r="2.5" fill="#ff4040"/>
    <circle cx="262" cy="178" r="2.5" fill="#ff4040"/>
    <!-- 작은 파티클 -->
    <circle cx="145" cy="30"  r="1.5" fill="#ff6060" opacity="0.7"/>
    <circle cx="235" cy="30"  r="1.5" fill="#ff6060" opacity="0.7"/>
    <circle cx="55"  cy="80"  r="1.5" fill="#dd3030" opacity="0.6"/>
    <circle cx="325" cy="80"  r="1.5" fill="#dd3030" opacity="0.6"/>
    <circle cx="55"  cy="150" r="1.5" fill="#dd3030" opacity="0.6"/>
    <circle cx="325" cy="150" r="1.5" fill="#dd3030" opacity="0.6"/>
  </g>
</svg>
