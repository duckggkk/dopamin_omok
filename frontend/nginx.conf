# ── 레이트 리미팅용 메모리 존 (http 컨텍스트) ──────────────────────────────
# 이 파일은 /etc/nginx/conf.d/default.conf 로 들어가 http 블록 안에 포함되므로
# 여기서 limit_req_zone 을 정의할 수 있다.
#   - 키: 클라이언트 실제 IP($binary_remote_addr, 아래 real_ip 로 복원된 값)
#   - rate=20r/m → IP당 분당 20회(평균 3초당 1회). 사람에겐 넉넉, 무차별 대입엔 치명적.
#   - 존 크기 10m ≈ IP 16만 개 추적 가능.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── 실제 클라이언트 IP 복원 ────────────────────────────────────────────────
    # 이 nginx 는 Caddy 뒤에 있어 $remote_addr 가 항상 Caddy 컨테이너 IP 다.
    # 그대로 두면 모든 사용자가 한 IP 로 묶여 레이트 리밋이 전체를 함께 차단한다.
    # Caddy 가 넘겨주는 X-Forwarded-For 의 클라이언트 IP 를 진짜 출처로 인정한다.
    # (nginx 는 외부에 직접 노출되지 않고 내부망의 Caddy 만 접근하므로 사설망 대역만 신뢰)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # React SPA 라우팅 (새로고침 시 index.html 반환)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 인증 엔드포인트: 레이트 리미팅 적용 (로그인/회원가입/토큰갱신 무차별 대입 차단) ──
    # /api/ 보다 더 구체적인 경로라 nginx 가 인증 요청에 대해 이 블록을 우선 선택한다.
    #   - burst=10: 짧은 순간 최대 10건까지 버퍼 허용(정상 사용자의 연속 동작 대비)
    #   - nodelay: 버스트분은 지연 없이 즉시 처리하고, 그 한도를 넘는 초과분만 429 로 거절
    location /api/auth/ {
        limit_req        zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend:8080/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API 프록시 → backend 컨테이너
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket 프록시 (STOMP/SockJS)
    location /ws {
        proxy_pass         http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # 정적 파일 캐시
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
