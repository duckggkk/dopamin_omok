# ── 레이트 리미팅용 메모리 존 (http 컨텍스트) ──────────────────────────────
# 이 파일은 /etc/nginx/conf.d/default.conf 로 들어가 http 블록 안에 포함되므로
# 여기서 limit_req_zone 을 정의할 수 있다.
#   - 키: 클라이언트 실제 IP($binary_remote_addr, 아래 real_ip 로 복원된 값)
#   - rate=20r/m → IP당 분당 20회(평균 3초당 1회). 사람에겐 넉넉, 무차별 대입엔 치명적.
#   - 존 크기 10m ≈ IP 16만 개 추적 가능.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

# ── 원래 프로토콜(https) 보존 ────────────────────────────────────────────────
# 이 nginx 는 Caddy 뒤에 있고, Caddy→nginx 구간은 도커 내부망의 평문 HTTP 다.
# 따라서 $scheme 는 항상 "http" 이며, 그대로 X-Forwarded-Proto 에 넣으면
# Caddy 가 붙여준 "https" 를 덮어써 버린다.
#
# 그 결과 백엔드의 request.isSecure() 가 false 가 되고
# (application-prod.yml 의 forward-headers-strategy: framework 가 이 헤더를 읽는다),
# refresh_token · oauth_state 쿠키에서 Secure 플래그가 빠졌다.
# → 사용자가 http:// 로 접속하는 순간 리프레시 토큰이 평문으로 나간다.
#
# 상위 프록시가 넣어준 값이 있으면 그대로 쓰고, 없을 때만 $scheme 로 떨어진다.
# (nginx 는 외부에 직접 노출되지 않고 Caddy 만 접근할 수 있으며,
#  Caddy 의 reverse_proxy 는 X-Forwarded-Proto 를 자신이 직접 설정하므로
#  클라이언트가 이 헤더를 위조해 넣을 수 없다)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── 실제 클라이언트 IP 복원 ────────────────────────────────────────────────
    # 이 nginx 는 Caddy 뒤에 있어 $remote_addr 가 항상 Caddy 컨테이너 IP 다.
    # 그대로 두면 모든 사용자가 한 IP 로 묶여 레이트 리밋이 전체를 함께 차단한다.
    # Caddy 가 넘겨주는 X-Forwarded-For 의 클라이언트 IP 를 진짜 출처로 인정한다.
    # (nginx 는 외부에 직접 노출되지 않고 내부망의 Caddy 만 접근하므로 사설망 대역만 신뢰)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # React SPA 라우팅 (새로고침 시 index.html 반환)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 인증 엔드포인트: 레이트 리미팅 적용 (로그인/회원가입/토큰갱신 무차별 대입 차단) ──
    # /api/ 보다 더 구체적인 경로라 nginx 가 인증 요청에 대해 이 블록을 우선 선택한다.
    #   - burst=10: 짧은 순간 최대 10건까지 버퍼 허용(정상 사용자의 연속 동작 대비)
    #   - nodelay: 버스트분은 지연 없이 즉시 처리하고, 그 한도를 넘는 초과분만 429 로 거절
    location /api/auth/ {
        limit_req        zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend:8080/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # API 프록시 → backend 컨테이너
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # WebSocket 프록시 (STOMP over native WebSocket)
    # 백엔드 context-path 가 /api 라서 STOMP 엔드포인트의 실제 주소는 /api/ws 다.
    # 따라서 외부 /ws 요청을 backend 의 /api/ws 로 넘겨야 한다(REST의 /api/ 규칙과 동일).
    # 개발환경 Vite 도 동일하게 /ws → /api/ws 로 rewrite 한다(vite.config.ts).
    location /ws {
        proxy_pass         http://backend:8080/api/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   Origin     $http_origin;   # 백엔드 Origin 검사용 — 원본 그대로 전달
        # 핸드셰이크도 일반 HTTP 요청이므로 REST 와 동일하게 출처·프로토콜을 넘긴다.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
    }

    # 정적 파일 캐시
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
