# MySQL benchmark profile only. Normal tests keep using application.yml with H2.
spring:
  datasource:
    url: 'jdbc:mysql://localhost:${omok.bench.mysql.port:${OMOK_BENCH_MYSQL_PORT:3307}}/dopamin_omok_bench?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true'
    username: '${omok.bench.mysql.username:${OMOK_BENCH_MYSQL_USERNAME:root}}'
    password: '${omok.bench.mysql.password:${OMOK_BENCH_MYSQL_PASSWORD:root1234}}'
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        generate_statistics: true
  flyway:
    enabled: false
