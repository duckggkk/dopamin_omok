spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 4 vCPU / 4GB 서버 + 같은 호스트의 MySQL → 풀을 작게. 커넥션 1개당 MySQL 메모리를
      # 쓰므로 과하게 잡으면 손해. 코어 수 기준 10이면 이 규모 트래픽엔 충분.
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 관리. Hibernate는 검증만 수행(자동 변경 금지).
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true   # 기존 데이터를 이관한 DB라도 안전하게 베이스라인 후 마이그레이션
    baseline-version: 1

  # 회원가입 이메일 인증 발송(SMTP). 값은 환경변수로 주입.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            # enable 만 두면 서버가 STARTTLS 를 광고하지 않을 때 "평문으로 폴백"한다.
            # 중간자가 서버 응답에서 STARTTLS 광고를 지우면 SMTP AUTH 계정정보가
            # 그대로 평문으로 나가므로, TLS 로 올리지 못하면 아예 실패시킨다.
            required: true
          ssl:
            # CVE-2026-40992 대응.
            # Spring Boot 의 Mail 자동설정은 TLS 소켓만 붙이고 인증서의 호스트명 검증
            # (mail.smtp.ssl.checkserveridentity)을 켜지 않는다. 영향 범위는
            # 3.4.0–3.4.16 / 3.5.0–3.5.14 / 4.0.0–4.0.6 이고 이 프로젝트는 3.4.1 이다.
            # 이 값을 직접 설정한 애플리케이션은 영향을 받지 않는다(Spring 공식 권고).
            # 끄여 있으면 다른 호스트용 인증서를 제시하는 중간자를 걸러내지 못한다.
            checkserveridentity: true

app:
  shop:
    # 오픈베타: PG 결제 연동 전까지 무료(검증 없는) 직접 충전을 한시적으로 허용한다.
    # ⚠️ 실결제 도입 시 반드시 false 로 되돌리고 PG 영수증 검증 경로로 전환할 것.
    direct-charge-enabled: true

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1800000
    refresh-token-expiration: 604800000

  cors:
    allowed-origins:
      - ${FRONTEND_URL}

  # 인증 메일 발신자 주소
  mail:
    from: ${MAIL_FROM}

  # 인증 메일 안의 링크가 가리킬 운영 프론트 주소
  frontend:
    url: ${FRONTEND_URL}

  oauth2:
    # 카카오 로그인은 아직 미구현(설정 자리만 둔다). 연동 시 google 과 동일 패턴으로
    # OAuth2Controller/OAuth2Service/어댑터를 추가하면 된다.
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      # 구글 콘솔 '승인된 리디렉션 URI' 와 정확히 일치해야 함. 예) https://<도메인>/api/auth/oauth2/google/callback
      redirect-uri: ${GOOGLE_REDIRECT_URI:}

server:
  port: ${PORT:8080}
  # Caddy/Nginx(리버스 프록시) 뒤에서 X-Forwarded-* 를 신뢰해 https/원본 IP 를 올바르게 인식
  # (OAuth 리다이렉트 URL·보안 쿠키·로깅 정확도에 필요)
  forward-headers-strategy: framework

# 운영에서는 API 문서를 노출하지 않는다(엔드포인트/스키마 정보 노출 차단).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Actuator: 헬스 체크 + Prometheus 메트릭만 노출(나머지 엔드포인트는 닫음).
#   - health:     외부 공개(/api/actuator/health) — 배포/컨테이너 헬스체크용
#   - prometheus: 내부망 전용(/api/actuator/prometheus) — Caddy가 외부 접근을 차단하고,
#                 도커 내부망의 Prometheus 컨테이너만 직접 수집한다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: dopamin-omok      # Grafana에서 앱 단위로 구분할 공통 라벨

logging:
  level:
    com.dopamin.omok: INFO
    org.hibernate.SQL: WARN
