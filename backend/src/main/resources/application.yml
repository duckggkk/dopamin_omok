spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  # Redis 연결. 로컬(네이티브)은 localhost, 도커/운영은 REDIS_HOST=redis 로 주입한다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul

server:
  port: 8080
  servlet:
    context-path: /api

app:
  assets:
    # classpath: resources/skins/ 에서 직접 서빙 (기본값, 소규모 적합)
    # s3: S3SkinAssetAdapter 활성화 — S3 서명 URL 방식으로 전환
    storage: classpath
  shop:
    # 결제(PG) 미연동 상태의 직접 충전 허용 여부 — 기본 true(로컬/데모).
    # 운영(prod)에서는 application-prod.yml 에서 false 로 덮어 무한 충전 악용을 막는다.
    direct-charge-enabled: true
    # 충전 패키지 (가격/구성 변경 시 코드 수정 없이 여기만 변경)
    packages:
      - { id: SMALL,   currency: 50,   priceKrw: 5000 }
      - { id: BASIC,   currency: 100,  priceKrw: 10000 }
      - { id: MEDIUM,  currency: 200,  priceKrw: 20000 }
      - { id: LARGE,   currency: 550,  priceKrw: 50000 }
      - { id: PREMIUM, currency: 1200, priceKrw: 100000 }
    # 뽑기 상자 (상자에서 나오는 아이템 풀은 DB items 테이블에서 자동 조회)
    gacha:
      - { type: DEFEAT_MESSAGE, name: "문구 랜덤 뽑기 상자",      price: 30 }
      - { type: DEFEAT_EFFECT,  name: "승패 이펙트 랜덤 뽑기 상자", price: 60 }
      - { type: BOARD_SKIN,     name: "바둑판 스킨 랜덤 뽑기 상자", price: 50 }
      - { type: STONE_SOUND,    name: "착수음 랜덤 뽑기 상자",      price: 40 }
      - { type: STONE_SKIN,     name: "바둑알 스킨 랜덤 뽑기 상자", price: 60 }
      - { type: STONE_EFFECT,   name: "착수 효과 랜덤 뽑기 상자",   price: 50 }
      - { type: CHARACTER_SKIN, name: "피지컬 캐릭터 랜덤 뽑기 상자", price: 70 }
  # 피지컬 오목(실시간 액션 모드) 런타임/밸런스. 코드 수정 없이 여기서 조절(보드 크기/쿨다운/아이템).
  physical-omok:
    board-size: 14            # 보드 N×N (변경 가능)
    win-count: 5              # 5목 완성 시 승리
    move-cooldown-ms: 140     # 한 칸 이동 간 최소 간격(살짝 신중한 템포)
    place-cooldown-ms: 150    # 착수 간 최소 간격(중복 착수만 방지 — 러시는 win-settle-ms가 막음)
    destroy-cooldown-ms: 0    # Shift 파괴 쿨다운 없음(0 = 즉시 연속 파괴 가능)
    win-settle-ms: 2000       # 5목이 2초 유지돼야 승리 확정 — 그 사이 끊으면 무효(러시 방지 + 역전 여지)
    countdown-ms: 3000        # 시작 시 보드/캐릭터 세팅 후 3·2·1 카운트다운(이 동안 입력·이동 차단)
    tick-interval-ms: 60      # 서버 틱(이동/스폰/스냅샷) 주기 ≈ 16Hz
    item-spawn-interval-ms: 7000
    max-items-on-field: 3
    speed-boost-duration-ms: 5000
    speed-boost-move-cooldown-ms: 70  # 부스트 중 이동 간격(기본의 절반)
    item-weights:             # 출현 가중치(흔할수록 큼) — 약한 부스트 흔하게, 역전 폭탄 드물게
      SPEED_BOOST: 50
      CRATER: 30
      BOMB: 20
    training-log-enabled: true # 게임마다 ML 학습용 행동 로그 기록(서버 전용 저장). 끄면 기록 안 함
  # 만남의 광장(실시간 아바타 커뮤니티 공간) 런타임. 코드 수정 없이 여기서 조절.
  plaza:
    world-width: 1600         # 월드 가로(px) — 화면보다 큼(카메라가 따라감)
    world-height: 1200        # 월드 세로(px)
    channel-capacity: 30      # 채널당 정원(채우기 우선, 초과 시 새 채널)
    tick-interval-ms: 100     # 서버 틱(이동/스냅샷) — 걷기엔 충분(클라가 보간) ≈ 10Hz
    move-step: 12             # 틱당 이동 픽셀
    spawn-margin: 120         # 스폰 시 월드 경계 여백

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.dopamin.omok: DEBUG
    # 주의: Hibernate SQL/바인드 파라미터 DEBUG 로그는 민감정보(이메일/비밀번호 등)를
    # 노출할 수 있어 베이스에서 활성화하지 않는다. 로컬에서만 application-local.yml 에
    # 아래를 추가해 사용하세요:
    #   org.hibernate.SQL: DEBUG
    #   org.hibernate.orm.jdbc.bind: TRACE
