spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # 메일 — dev 컨테이너는 실제 발송 없이 부팅만 가능하면 된다(JavaMailSender 빈 생성용).
  # 실제 발송이 필요하면 MAIL_* 환경변수를 compose 에 넘겨서 덮어쓴다.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jpa:
    hibernate:
      # 스키마 관리 주체는 Flyway 하나로 통일. dev/docker 도 운영(prod)과 동일하게 validate 로 맞춰
      # Flyway 마이그레이션 경로를 dev 에서 미리 검증한다(운영 validate 에서야 터지는 사고 방지).
      # ⚠️ 기존 update 로 만들어진 dev DB 볼륨은 스키마가 어긋나 validate 가 실패할 수 있다.
      #    그 경우 dev DB 볼륨(mysql_dev_data)을 삭제 후 재기동하면 Flyway 가 깨끗이 재구성한다.
      ddl-auto: validate
    show-sql: false

app:
  mail:
    from: ${MAIL_FROM:dev@localhost}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1800000
    refresh-token-expiration: 604800000

  cors:
    allowed-origins:
      - http://localhost:3000       # dev: 호스트에서 직접 접근
      - http://localhost:80         # prod: nginx
      - http://frontend             # prod: 컨테이너 내부
      - http://frontend:80

  oauth2:
    # 카카오 로그인은 아직 미구현(설정 자리만 둔다).
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth2/google/callback}

  # 콜백 후 토큰을 넘겨줄 프론트 주소(소셜 로그인용). dev 컨테이너 프론트 포트.
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

# Actuator: 로컬 관측 스택(prometheus 컨테이너)이 메트릭을 긁어갈 수 있게 prod 와 같은 엔드포인트를 연다.
# 기본값은 health 뿐이라 이게 없으면 /api/actuator/prometheus 가 404 → 대시보드가 전부 빈다.
# dev 전용 프로필이므로 외부 노출 우려는 없다(운영은 application-prod.yml 이 따로 관리).
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: dopamin-omok      # 대시보드가 앱 단위로 구분하는 공통 라벨(prod 와 동일)

logging:
  level:
    com.dopamin.omok: INFO
    org.hibernate.SQL: WARN
