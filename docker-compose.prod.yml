name: dopamin-omok-prod

# 운영 배포용 compose.
#   - 이미지는 로컬 빌드가 아니라 GHCR(레지스트리)에서 pull → 서버는 빌드 부담 없음.
#   - 백엔드는 prod 프로파일(Flyway + ddl-auto:validate).
#   - 외부 노출은 Caddy(80/443)만. 나머지는 내부망(omok_net)에서만 통신.
# 실행:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"     # 디스크가 로그로 가득 차 서버가 죽는 사고 방지
    max-file: "3"

services:
  # ── Database ─────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: omok_db
    restart: unless-stopped
    mem_limit: 768m            # 4GB 서버: DB 메모리 상한(호스트 전체 OOM 방지)
    # 4GB 서버에 맞춘 MySQL 메모리 절감 튜닝
    command:
      - --innodb-buffer-pool-size=256M      # 읽기 캐시(작게 유지 — 컨테이너 한도 내)
      - --max-connections=60                # 백엔드 풀(10)에 충분 — 연결당 메모리 절약
      - --performance-schema=OFF            # 미사용 모니터링 스키마 끔(~150MB 절약)
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: dopamin_omok
      # 앱 전용 계정을 MySQL 이미지가 직접 생성(별도 init 스크립트의 하드코딩 계정 미사용)
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    # DB 포트는 서버 내부(loopback)에만 노출 — 인터넷엔 비공개.
    # 관리자가 SSH 터널을 통해서만 접근(예: DBeaver / VSCode DB 클라이언트).
    # 절대 "3306:3306" 또는 "0.0.0.0:..." 로 바꾸지 말 것(전 세계에 DB가 열림).
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - omok_net
    logging: *default-logging

  # ── Redis (이메일 인증코드·Refresh 토큰 저장, 내부 전용) ───────────────────
  # TTL 자동 만료라 청소 배치가 불필요. 데이터가 작아 메모리 상한을 작게 잡는다.
  #   - maxmemory 64mb + noeviction: 한도 초과 시 조용히 버리지 않고 쓰기를 거부(인증 토큰 유실 방지).
  #   - appendonly: 재시작해도 로그인 세션이 살아있도록 디스크에 영속화.
  redis:
    image: redis:7-alpine
    container_name: omok_redis
    restart: unless-stopped
    mem_limit: 96m            # 4GB 서버: Redis 메모리 상한
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - omok_net
    logging: *default-logging

  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    image: ${IMAGE_BACKEND:?IMAGE_BACKEND is required}   # 예) ghcr.io/owner/repo/backend:latest
    container_name: omok_backend
    restart: unless-stopped
    mem_limit: 1g             # 4GB 서버: 백엔드(JVM) 메모리 상한
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_HOST: redis        # 이메일 인증코드·Refresh 토큰 저장소
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      # 소셜 로그인 (선택)
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # 이메일 인증 발송(SMTP)
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      # 4GB 서버 메모리 보호: 힙 512m + 다이렉트버퍼 상한128m → 컨테이너 한도(1g) 안에서 안전.
      # (기본값은 다이렉트버퍼 상한이 힙과 같아 힙512+다이렉트512로 한도를 넘길 수 있어 명시)
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx512m -XX:MaxDirectMemorySize=128m}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - omok_net
    logging: *default-logging

  # ── Frontend (SPA + /api·/ws 프록시, 내부 전용) ───────────────────────────
  frontend:
    image: ${IMAGE_FRONTEND:?IMAGE_FRONTEND is required}  # 예) ghcr.io/owner/repo/frontend:latest
    container_name: omok_frontend
    restart: unless-stopped
    mem_limit: 64m            # 정적 파일 서빙 nginx — 메모리 거의 안 씀
    depends_on:
      - backend
    networks:
      - omok_net
    logging: *default-logging

  # ── Caddy (외부 진입점: 자동 HTTPS + 점검 모드) ────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: omok_caddy
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}        # 예) omok.example.com
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/maintenance:/maintenance:ro       # maintenance.html + (토글 시) maintenance.on
      - caddy_data:/data                           # 발급받은 TLS 인증서 보관(재시작해도 유지)
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - omok_net
    logging: *default-logging

  # ── Prometheus (메트릭 수집, 내부 전용) ───────────────────────────────────
  # 백엔드의 /api/actuator/prometheus 를 주기적으로 긁어와 시계열로 저장한다.
  # 외부 포트를 열지 않으므로 omok_net 안에서만 접근 가능.
  prometheus:
    image: prom/prometheus:latest        # 운영 안정화 시 특정 버전 핀 권장(예: prom/prometheus:v3.1.0)
    container_name: omok_prometheus
    restart: unless-stopped
    mem_limit: 350m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d   # 15일치만 보관(디스크 보호)
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    networks:
      - omok_net
    logging: *default-logging

  # ── Loki (로그 저장소, 내부 전용) ─────────────────────────────────────────
  # Promtail 이 보내온 컨테이너 로그를 모아 저장하고, Grafana 가 검색하게 한다.
  # 외부 포트를 열지 않으므로 omok_net 안에서만 접근 가능.
  loki:
    image: grafana/loki:latest          # 운영 안정화 시 특정 버전 핀 권장(예: grafana/loki:3.3.0)
    container_name: omok_loki
    restart: unless-stopped
    mem_limit: 256m
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - omok_net
    logging: *default-logging

  # ── Promtail (로그 수집 에이전트, 내부 전용) ──────────────────────────────
  # 도커 API 로 실행 중인 컨테이너들을 발견해 로그를 Loki 로 전송한다.
  # docker.sock 은 읽기로만 마운트하고 외부 포트는 열지 않는다(보안).
  promtail:
    image: grafana/promtail:latest      # 운영 안정화 시 특정 버전 핀 권장(예: grafana/promtail:3.3.0)
    container_name: omok_promtail
    restart: unless-stopped
    mem_limit: 100m
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./deploy/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_data:/tmp
    depends_on:
      - loki
    networks:
      - omok_net
    logging: *default-logging

  # ── Grafana (대시보드, Caddy 통해 /grafana 로 노출) ────────────────────────
  grafana:
    image: grafana/grafana:latest        # 운영 안정화 시 특정 버전 핀 권장(예: grafana/grafana:11.4.0)
    container_name: omok_grafana
    restart: unless-stopped
    mem_limit: 300m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      # 하위 경로(/grafana) 서빙 — Caddy가 접두사를 그대로 넘기므로 Grafana가 직접 처리
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"          # 가입 비활성(관리자만)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - omok_net
    logging: *default-logging

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:

networks:
  omok_net:
    driver: bridge
